[project]
name = "tanker-risk-backend"
version = "0.1.0"
description = "Tanker fleet revenue risk dashboard backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "pyarrow>=15",
]

[project.optional-dependencies]
phase2 = ["arch>=6.3"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
